<!doctype html>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ski tours map</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="build/trailheads.js"></script>
<style>
body { margin: 0; }
#map { height: 100vh; height: 100dvh; }  /* dvh = the visible height on phones, under the address bar */
/* A popup never outgrows the screen, in either orientation; long lists scroll inside it. */
.leaflet-popup-content { max-height: 50vh; max-width: calc(100vw - 90px); overflow-y: auto; }
.pin { transform: translate(-50%, -50%); width: max-content; cursor: pointer; line-height: 0; }
/* Cluster bubbles go yellow (few) to red-orange (many), so none look like a green-circle rating. */
.marker-cluster div { width: 30px; height: 30px; margin: 5px; border-radius: 15px; text-align: center; line-height: 30px; }
.marker-cluster-small div { background: rgb(240, 195, 20); }
.marker-cluster-medium div { background: rgb(240, 130, 20); }
.marker-cluster-large div { background: rgb(225, 70, 20); }
.leaflet-control-attribution { font-size: 9px; }
.sym { vertical-align: top; font-size: 18px; padding-right: 4px; }
</style>
<div id="map"></div>
<script>
// Data: build/trailheads.js, made by build.py. HTML entities keep this file ASCII.
// Ski-trail symbols (green circle, blue square, black diamond) and SVG shapes for the pins.
var LEVELS = {
  green: {color: "#1a7f37", text: "&#9679;", svg: '<circle r="50"'},
  blue:  {color: "#0550ae", text: "&#9632;", svg: '<rect x="-40" y="-40" width="80" height="80"'},
  black: {color: "#000",    text: "&#9670;", svg: '<polygon points="0,-50 50,0 0,50 -50,0"'}};
// A pin nests one shape per difficulty at the trailhead: outermost = easiest, innermost = hardest.
var NEST = {1: [0.92], 2: [0.94, 0.78], 3: [0.94, 0.78, 0.56]};
var PIN_PX = 40, CLUSTER_OVERLAP = 0.7, BASEMAP_MAX_ZOOM = 16;  // USGS topo has no tiles past 16

function pin(levels) {
  return '<div class="pin"><svg width="' + PIN_PX + '" height="' + PIN_PX + '" viewBox="-50 -50 100 100">' +
    levels.map(function (d, i) {
      return '<g transform="scale(' + NEST[levels.length][i] + ')">' + LEVELS[d].svg +
             ' fill="' + LEVELS[d].color + '" stroke="#fff" stroke-width="6"/></g>';
    }).join("") + "</svg></div>";
}
function link(href, text) { return '<a target="_blank" rel="noopener" href="' + href + '">' + text + "</a>"; }
function popup(p) {
  return "<b>" + p.name + "</b>" + (p.approximate ? " (approximate location)" : "") + "<table>" +
    p.tours.map(function (t) {
      var L = LEVELS[t.difficulty];
      return '<tr><td class="sym" style="color:' + L.color + '">' + L.text + "</td><td><b>" + link(t.image, t.name) +
             "</b>" + [t.miles && t.miles + " mi", t.gain].filter(Boolean).join(", ").replace(/^(?=.)/, "<br>") +
             "<br>" + link(t.image, t.source) + "</td></tr>";
    }).join("") + "</table>";
}

// Zoom buttons go bottom right, where a popup (which opens upward) does not cover them.
var map = L.map("map", {attributionControl: false, zoomControl: false});
L.control.zoom({position: "bottomright"}).addTo(map);
// Credits, bottom left: the map libraries, the two tile sources, and the books.
var credits = L.control.attribution({position: "bottomleft", prefix:
  '<a href="https://leafletjs.com">Leaflet</a>, <a href="https://github.com/Leaflet/Leaflet.markercluster">markercluster</a>'}).addTo(map);
L.tileLayer("https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}",
            {maxZoom: BASEMAP_MAX_ZOOM, attribution: "USGS The National Map"}).addTo(map);
// Roads drawn over the topo map: coloured, labelled highways.
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}",
            {maxZoom: BASEMAP_MAX_ZOOM, attribution: "roads: Esri"}).addTo(map);
credits.addAttribution("tours: Meissner (1984), Vielbig (1994)");
var layer = L.geoJSON(trailheads, {
  pointToLayer: function (f, latlng) {
    var levels = ["green", "blue", "black"].filter(function (d) {
      return f.properties.tours.some(function (t) { return t.difficulty === d; }); });
    return L.marker(latlng, {icon: L.divIcon({className: "", iconSize: [0, 0], html: pin(levels)})})
            .bindPopup(popup(f.properties));
  }});
// Pins combine only when they overlap by more than a graze; the shapes don't fill their box,
// so the radius is a bit under a pin's width (the library's default is twice that).
L.markerClusterGroup({maxClusterRadius: PIN_PX * CLUSTER_OVERLAP}).addLayer(layer).addTo(map);
map.fitBounds(layer.getBounds().pad(0.2));
</script>
