<!doctype html>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ski tours map</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-hash@0.2.1/leaflet-hash.js"></script>
<script src="build/trailheads.js"></script>
<style>
body { margin: 0; }
#map { height: 100vh; height: 100dvh; }  /* dvh = the visible height on phones, under the address bar */
/* A popup never outgrows the screen, in either orientation; long lists scroll inside it. */
.leaflet-popup-content { max-height: 50vh; max-width: calc(100vw - 90px); overflow-y: auto; }
.pin use { stroke: #fff; stroke-width: 4; }
.pin svg { overflow: visible; }  /* a grown shape may poke past the box */
/* Each tour is one card; tapping anywhere on it opens the tour's pages. */
.card { display: flex; gap: 6px; margin-top: 6px; padding: 5px 7px; border: 1px solid #bbb; border-radius: 6px;
        color: inherit !important; text-decoration: none; }
/* Without this a long tour name squeezes its symbol smaller than the others. */
.card svg { flex: none; }
.card a { color: inherit !important; text-decoration: none; }
.card .also { text-decoration: underline; }  /* the second book's pages: its own link inside the card */
/* Cluster bubbles go yellow (few) to red-orange (many), so none look like a green-circle rating. */
.marker-cluster div { width: 30px; height: 30px; margin: 5px; border-radius: 50%; text-align: center; line-height: 30px; }
.marker-cluster-small div { background: rgb(240, 195, 20); }
.marker-cluster-medium div { background: rgb(240, 130, 20); }
.marker-cluster-large div { background: rgb(225, 70, 20); }
</style>
<!-- Ski-trail symbols, drawn once and reused by every pin and popup. -->
<svg width="0" height="0" style="position: absolute"><defs>
  <circle id="green" r="50" fill="#1a7f37"/>
  <rect id="blue" x="-40" y="-40" width="80" height="80" fill="#0550ae"/>
  <polygon id="black" points="0,-50 42,0 0,50 -42,0" fill="#000"/>  <!-- a little narrower than a rotated square -->
  <!-- Double black (ski mountaineering): two narrow diamonds overlapping at the waist, one outline so
       the pin's white stroke runs round the outside only and black meets black. -->
  <polygon id="double" points="-50,0 -20,-50 0,-16.7 20,-50 50,0 20,50 0,16.7 -20,50" fill="#000"/>
</defs></svg>
<div id="map"></div>
<script>
// Data: build/trailheads.js, made by build.py.
const PIN_PX = 32, SYMBOL_PX = 18, CLUSTER_RADIUS_PX = 23;
const BASEMAP_MAX_ZOOM = 16;  // USGS topo has no tiles past 16
// A pin nests one shape per difficulty at the trailhead: outermost = easiest, innermost = hardest.
const NEST = {1: [0.92], 2: [0.94, 0.70], 3: [0.94, 0.70, 0.56]};
// The narrow black diamond reads smaller than the other shapes: grow it a little when it stands alone,
// and shrink it a little when it sits inside a circle or square, so more of the outer colour shows.
const BLACK_SCALE = {1: 1.08, 2: 1.0, 3: 1.0};
const BLACK_STRETCH = 1.08;
// A badge at the pin's top right corner: X = the parking place is gone, i = changed since the book
// (the popup says how), ? = approximate location. A closed pin shows the X whatever else applies.
const BADGES = {closed: ["X", "#c00", "sans-serif", 38, 13], moved: ["i", "#000", "serif", 40, 14], approximate: ["?", "#000", "sans-serif", 38, 13]};
const badge = kind => { const [mark, colour, font, size, y] = BADGES[kind]; return '<g transform="translate(34,-34)">' +
  `<circle r="24" fill="#fff" stroke="${colour}" stroke-width="5"/>` +
  `<text y="${y}" text-anchor="middle" font-size="${size}" font-weight="bold" font-family="${font}" fill="${colour}">${mark}</text></g>`; };  // inside another shape the diamond is a touch taller than it is wide

const svg = (px, shapes) => `<svg width="${px}" height="${px}" viewBox="-50 -50 100 100">${shapes}</svg>`;
const pin = (levels, kind) => svg(PIN_PX, levels.map((d, i) =>
  `<use href="#${d}" transform="scale(${NEST[levels.length][i] * (d === "black" ? BLACK_SCALE[levels.length] : 1)}` +
  `${d === "black" && levels.length > 1 ? `, ${NEST[levels.length][i] * BLACK_SCALE[levels.length] * BLACK_STRETCH}` : ""})"/>`).join("") + (kind ? badge(kind) : ""));
const link = (href, html, cls = "") => `<a class="${cls}" target="_blank" rel="noopener" href="${href}">${html}</a>`;
// A card opens its tour's pages. A tour two books describe has two sets of pages, so that card is not
// one link: its name, numbers and first source open the first book, and the second source line the other.
// The Google Maps link goes to the pin's coordinates (opens the app on a phone), so it works for every trailhead.
// With a known Google place (data/google_places.toml) the link opens that place, named so a wrong match shows.
const mapsLink = (p, ll) => p.place
  ? link(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.place.name)}&query_place_id=${p.place.id}`, `Google Maps: ${p.place.name}`)
  : link(`https://www.google.com/maps/search/?api=1&query=${ll.lat},${ll.lng}`, "Google Maps");
const popup = (p, ll) => `<b>${p.name}</b>${p.approximate ? " (approximate location)" : ""} &middot; ${mapsLink(p, ll)}` +
  (p.status ? `<br><i>${p.status.replace(/^./, c => c.toUpperCase())}</i>` : "") + p.tours.map(t => {
  const symbol = svg(SYMBOL_PX, `<use href="#${t.difficulty}"/>`);
  const text = [`<b>${t.name}</b>`, [t.miles && `${t.miles} mi`, t.gain].filter(Boolean).join(", "), t.source]
    .filter(Boolean).join("<br>");
  return t.also.length
    ? `<div class="card">${symbol}<span>${link(t.image, text)}` +
      t.also.map(a => "<br>" + link(a.image, a.source, "also")).join("") + "</span></div>"
    : link(t.image, `${symbol}<span>${text}</span>`, "card");
}).join("");

// Zoom buttons go bottom right, where a popup (which opens upward) does not cover them.
const map = L.map("map", {attributionControl: false, zoomControl: false});
L.control.zoom({position: "bottomright"}).addTo(map);
L.tileLayer("https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}",
            {maxZoom: BASEMAP_MAX_ZOOM}).addTo(map);
const layer = L.geoJSON(trailheads, {pointToLayer: ({properties}, latlng) => {
  // On a pin a double black counts as black; only a pin with nothing but double blacks shows the double.
  const pinLevel = t => t.difficulty === "double" ? "black" : t.difficulty;
  let levels = ["green", "blue", "black"].filter(d => properties.tours.some(t => pinLevel(t) === d));
  if (properties.tours.every(t => t.difficulty === "double")) levels = ["double"];
  return L.marker(latlng, {icon: L.divIcon({className: "pin", iconSize: [PIN_PX, PIN_PX], html: pin(levels, properties.status ? properties.status.split(":")[0] : properties.approximate ? "approximate" : "")})})
          .bindPopup(popup(properties, latlng));
}});
// Pins combine only when they overlap by more than a graze; the shapes don't fill their box,
// so the radius is under a pin's width: pins may overlap by up to PIN_PX - CLUSTER_RADIUS_PX.
L.markerClusterGroup({maxClusterRadius: CLUSTER_RADIUS_PX}).addLayer(layer).addTo(map);
map.fitBounds(layer.getBounds().pad(0.2));
new L.Hash(map);  // the address ends in #zoom/lat/lon, so any view can be linked
</script>
